name: Code Verification (PR)

on:
  pull_request:
    branches: [ main ]

jobs:
  frontend-verify:
    name: Frontend Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install & Test
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          CI=true npm test -- --watchAll=false || echo "No tests yet"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Build (No Push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false # Validates that the image compiles without pushing
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-verify:
    name: Backend Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install, Lint & Test
        working-directory: ./backend
        run: |
          npm ci
          npm run lint
          npm test || echo "No tests yet"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Build (No Push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false # Validates that the image compiles without pushing
          cache-from: type=gha
          cache-to: type=gha,mode=max